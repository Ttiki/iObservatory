<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Impact Studio · Compiler</title>
    <style>
        body{font:16px system-ui;background:#f4f6fa;color:#192439;max-width:1100px;margin:32px auto;padding:0 24px}
        nav{display:flex;gap:24px}textarea{width:100%;height:42vh;box-sizing:border-box;font:13px monospace;padding:16px;border:1px solid #aab7cb;border-radius:8px}
        button{padding:10px 20px;margin:12px 8px 12px 0;cursor:pointer}pre{white-space:pre-wrap;background:white;padding:20px;border-radius:8px}
    </style></head>
<body><nav><a href="./">Author</a><strong>Build</strong><span>Debugger — planned</span></nav>
<h1>Compile an impact model</h1>
<p>Validate XML, inspect diagnostics, and download PostgreSQL scripts and generated Hop pipelines. This version does not deploy or execute builds.</p>
<input type="file" id="file" accept=".xml"><button id="example">Load DTO–BIP example</button>
<textarea id="xml" aria-label="Impact model XML" spellcheck="false"></textarea>
<div><button id="validate">Validate</button><button id="compile">Download build</button></div>
<pre id="report" aria-live="polite">Choose an XML model to begin.</pre><script src="js/build.js"></script></body></html>
